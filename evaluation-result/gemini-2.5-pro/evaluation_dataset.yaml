      \ relationships, prefer using relations over spec fields, e.g. the\\nspecial\
      \ syntax \\\"relations.ownedBy\\\" instead of \\\"spec.owner\\\".\\n\\nThe unique\
      \ identifying key for an entity is its so called entity reference (or entity\
      \ ref\\nfor short), on the form of \\\"kind:namespace/name\\\", e.g. \\\"component:default/my-service\\\
      \".\\nThese are always uniformly lowercased in the \\\"en-US\\\" locale.\\n\\\
      n## Entity Metadata field\\n\\nThe \\\"metadata\\\" object field on all entities\
      \ has the same static schema. Some common fields\\nthere are:\\n\\n* \\\"name\\\
      \": The name of the entity. Must be unique within the catalog at any given point\
