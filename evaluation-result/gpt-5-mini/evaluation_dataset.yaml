        arguments:
          owner: group:default/accounts-team
    - - tool_name: software-catalog-mcp-extras.query-catalog-entities
        arguments:
          owner: group:default/accounts-team
          verbose: true
    contexts:
    - "```json\n{\n  \"totalEntities\": 0,\n  \"entitiesWithDocs\": 0,\n  \"coveragePercentage\"\
      : 0\n}\n```"
    - "```json\n{\n  \"entities\": []\n}\n```"
    response: "I ran a TechDocs coverage analysis and an entity query for owner \"\
      group:default/accounts-team\". Results:\n\n- TechDocs coverage for owner group:default/accounts-team\n\
      \  - totalEntities: 0\n  - entitiesWithDocs: 0\n  - coveragePercentage: 0.0%\n\
      \n- Entities returned for owner group:default/accounts-team\n  - [] (no catalog\
      \ entities found)\n\nWhat this means\n- There are currently no catalog entities\
      \ owned by group:default/accounts-team, so coverage is reported as 0% because\
      \ the entity set is empty.\n- This is different from “entities exist but lack\
      \ TechDocs”; it means the catalog contains no entities with that owner reference.\n\
      \nPossible causes and next steps\n1. Owner reference mismatch\n   - Confirm\
      \ the group entity reference format and namespace. Owner refs are usually like\
      \ group:<namespace>/<name> (commonly group:default/<name>).\n2. Group might\
      \ not own any entities\n   - The group could exist but not be listed as owner\
      \ on any Component/API/Resource entities.\n3. Entities might be owned by a user,\
      \ another group, or use a different namespace\n   - Try searching by other owner\
      \ refs or searching for entities whose metadata or tags mention \"accounts\"\
      .\n\nI can do one of these for you next (pick one):\n- Search for group entities\
      \ with \"accounts\" in their name (to find the correct group ref).\n- List all\
      \ entities that mention \"accounts\" in name/title/tags (to find possible owners).\n\
      - Re-run TechDocs coverage for a different owner ref or for a namespace.\n\n\
      Which would you like me to run?"
