- conversation_group_id: catalog-model-description
  description: Catalog model description
  tag: catalog
  turns:
  - turn_id: model_description
    query: Describe the catalog model and what entity kinds are registered
    expected_tool_calls:
    - - tool_name: catalog.get-catalog-model-description
        arguments: {}
    expected_response: Describes the Backstage catalog model and registered entity
      kinds.
    expected_intent: describe the Backstage catalog model / entity kinds
    tool_calls:
    - - tool_name: catalog.get-catalog-model-description
        arguments: {}
    contexts:
    - "```json\n{\n  \"description\": \"# Catalog Model\\n\\nThe software catalog\
      \ contains a few key concepts:\\n\\n* Entities\\n  * rich objects with various\
      \ kinds, with different schemas\\n  * can have relations between each other\\\
      n* Locations\\n  * registered as type/target pairs\\n  * typically in the form\
      \ of URLs that the catalog has been tasked with keeping track of\\n\\n## Entities\\\
      n\\nThe catalog contains entities of different kinds. Every entity is an object\
      \ with\\nfields \\\"kind\\\", \\\"apiVersion\\\", \\\"metadata\\\", and optionally\
      \ \\\"spec\\\" and \\\"relations\\\".\\n\\nWhen querying the catalog you use\
      \ dot path notation to address fields, e.g. \\\"metadata.name\\\".\\nWhen querying\
      \ for entity relationships, prefer using relations over spec fields, e.g. the\\\
      nspecial syntax \\\"relations.ownedBy\\\" instead of \\\"spec.owner\\\".\\n\\\
      nThe unique identifying key for an entity is its so called entity reference\
      \ (or entity ref\\nfor short), on the form of \\\"kind:namespace/name\\\", e.g.\
      \ \\\"component:default/my-service\\\".\\nThese are always uniformly lowercased\
      \ in the \\\"en-US\\\" locale.\\n\\n## Entity Metadata field\\n\\nThe \\\"metadata\\\
      \" object field on all entities has the same static schema. Some common fields\\\
      nthere are:\\n\\n* \\\"name\\\": The name of the entity. Must be unique within\
      \ the catalog at any given point in time, for any given namespace + kind pair.\
      \ This value is part of the technical identifier of the entity, and as such\
      \ it will appear in URLs, database tables, entity references, and similar. It\
      \ is subject to restrictions regarding what characters are allowed. If you want\
      \ to use a different, more human readable string with fewer restrictions on\
      \ it in user interfaces, see the \\\"title\\\" field below.\\n* \\\"namespace\\\
      \" (default value: \\\"default\\\"): The namespace that the entity belongs to.\\\
      n* \\\"uid\\\": A globally unique ID for the entity. This field can not be set\
      \ by the user at creation time, and the server will reject an attempt to do\
      \ so. The field will be populated in read operations. The field can (optionally)\
      \ be specified when performing update or delete operations, but the server is\
      \ free to reject requests that do so in such a way that it breaks semantics.\\\
      n* \\\"etag\\\": An opaque string that changes for each update operation to\
      \ any part of the entity, including metadata. This field can not be set by the\
      \ user at creation time, and the server will reject an attempt to do so. The\
      \ field will be populated in read operations. The field can (optionally) be\
      \ specified when performing update or delete operations, and the server will\
      \ then reject the operation if it does not match the current stored value.\\\
      n* \\\"title\\\": A display name of the entity, to be presented in user interfaces\
      \ instead of the name property, when available. This field is sometimes useful\
      \ when the name is cumbersome or ends up being perceived as overly technical.\
      \ The title generally does not have as stringent format requirements on it,\
      \ so it may contain special characters and be more explanatory. Do keep it very\
      \ short though, and avoid situations where a title can be confused with the\
      \ name of another entity, or where two entities share a title. Note that this\
      \ is only for display purposes, and may be ignored by some parts of the code.\
      \ Entity references still always make use of the name property, not the title.\\\
      n* \\\"description\\\": A short (typically relatively few words, on one line)\
      \ description of the entity.\\n* \\\"annotations\\\": A map of annotations on\
      \ the entity.\\n* \\\"labels\\\": A map of labels on the entity.\\n* \\\"tags\\\
      \": A list of tags on the entity.\\n* \\\"links\\\": A list of links on the\
      \ entity.\\n\\n### Annotation \\\"backstage.io/managed-by-location\\\"\\n\\\
      nThe location reference that the catalog uses to manage and update the entity.\\\
      n\\n### Annotation \\\"backstage.io/managed-by-origin-location\\\"\\n\\nThe\
      \ original location reference that first discovered the entity.\\n\\n### Annotation\
      \ \\\"backstage.io/source-location\\\"\\n\\nThe location reference of the source\
      \ data for the entity, e.g. a file in a repository.\\n\\n### Annotation \\\"\
      ba"
    response: "# Catalog Model\n\nThe software catalog contains a few key concepts:\n\
      \n*   **Entities**: rich objects with various kinds, with different schemas\n\
      *   can have relations between each other\n*   **Locations**: registered as\
      \ type/target pairs, typically in the form of URLs that the catalog has been\
      \ tasked with keeping track of\n\n## Entities\n\nThe catalog contains entities\
      \ of different kinds. Every entity is an object with\nfields \"kind\", \"apiVersion\"\
      , \"metadata\", and optionally \"spec\" and \"relations\".\n\nWhen querying\
      \ the catalog you use dot path notation to address fields, e.g. \"metadata.name\"\
      .\nWhen querying for entity relationships, prefer using relations over spec\
      \ fields, e.g. the\nspecial syntax \"relations.ownedBy\" instead of \"spec.owner\"\
      .\n\nThe unique identifying key for an entity is its so called entity reference\
      \ (or entity ref\nfor short), on the form of \"kind:namespace/name\", e.g. \"\
      component:default/my-service\".\nThese are always uniformly lowercased in the\
      \ \"en-US\" locale.\n\n## Entity Metadata field\n\nThe \"metadata\" object field\
      \ on all entities has the same static schema. Some common fields\nthere are:\n\
      \n*   \"name\": The name of the entity. Must be unique within the catalog at\
      \ any given point in time, for any given namespace + kind pair. This value is\
      \ part of the technical identifier of the entity, and as such it will appear\
      \ in URLs, database tables, entity references, and similar. It is subject to\
      \ restrictions regarding what characters are allowed. If you want to use a different,\
      \ more human readable string with fewer restrictions on it in user interfaces,\
      \ see the \"title\" field below.\n*   \"namespace\" (default value: \"default\"\
      ): The namespace that the entity belongs to.\n*   \"uid\": A globally unique\
      \ ID for the entity. This field can not be set by the user at creation time,\
      \ and the server will reject an attempt to do so. The field will be populated\
      \ in read operations. The field can (optionally) be specified when performing\
      \ update or delete operations, but the server is free to reject requests that\
      \ do so in such a way that it breaks semantics.\n*   \"etag\": An opaque string\
      \ that changes for each update operation to any part of the entity, including\
      \ metadata. This field can not be set by the user at creation time, and the\
      \ server will reject an attempt to do so. The field will be populated in read\
      \ operations. The field can (optionally) be specified when performing update\
      \ or delete operations, and the server will then reject the operation if it\
      \ does not match the current stored value.\n*   \"title\": A display name of\
      \ the entity, to be presented in user interfaces instead of the name property,\
      \ when available. This field is sometimes useful when the name is cumbersome\
      \ or ends up being perceived as overly technical. The title generally does not\
      \ have as stringent format requirements on it, so it may contain special characters\
      \ and be more explanatory. Do keep it very short though, and avoid situations\
      \ where a title can be confused with the name of another entity, or where two\
      \ entities share a title. Note that this is only for display purposes, and may\
      \ be ignored by some parts of the code. Entity references still always make\
      \ use of the name property, not the title.\n*   \"description\": A short (typically\
      \ relatively few words, on one line) description of the entity.\n*   \"annotations\"\
      : A map of annotations on the entity.\n*   \"labels\": A map of labels on the\
      \ entity.\n*   \"tags\": A list of tags on the entity.\n*   \"links\": A list\
      \ of links on the entity.\n\n### Annotation \"backstage.io/managed-by-location\"\
      \n\nThe location reference that the catalog uses to manage and update the entity.\n\
      \n### Annotation \"backstage.io/managed-by-origin-location\"\n\nThe original\
      \ location reference that first discovered the entity.\n\n### Annotation \"\
      backstage.io/source-location\"\n\nThe location reference of the source data\
      \ for the entity, e.g. a file in a repository.\n\n### Annotation \"backstage.io/orphan\"\
      \n\nSet to \"true\" when the entity is not referenced by any location and is\
      \ scheduled for deletion.\n\n### Annotation \"backstage.io/view-url\"\n\nA URL\
      \ to view the entity in an external tool, e.g. a source code repository.\n\n\
      ### Annotation \"backstage.io/edit-url\"\n\nA URL to edit the entity in an external\
      \ tool, e.g. a source code repository.\n\n## Entity Kinds\n\nThe model contains\
      \ the following entity kinds:\n\n### Entity Kind \"API\"\n\n*   Singular in\
      \ text: \"api\"\n*   Plural in text: \"apis\"\n*   Versions:\n    *   apiVersion:\
      \ \"backstage.io/v1alpha1\"\n    *   apiVersion: \"backstage.io/v1beta1\"\n\n\
      An API describes an interface that can be exposed by a component.\n\n### Entity\
      \ Kind \"Component\"\n\n*   Singular in text: \"component\"\n*   Plural in text:\
      \ \"components\"\n*   Versions:\n    *   apiVersion: \"backstage.io/v1alpha1\"\
      \n    *   apiVersion: \"backstage.io/v1beta1\"\n\nA Component describes a software\
      \ component, usually with a distinct deployable or linkable artifact.\n\n###\
      \ Entity Kind \"Domain\"\n\n*   Singular in text: \"domain\"\n*   Plural in\
      \ text: \"domains\"\n*   Versions:\n    *   apiVersion: \"backstage.io/v1alpha1\"\
      \n    *   apiVersion: \"backstage.io/v1beta1\"\n\nA Domain groups a collection\
      \ of systems that share terminology, domain models, business purpose, or documentation.\n\
      \n### Entity Kind \"Group\"\n\n*   Singular in text: \"group\"\n*   Plural in\
      \ text: \"groups\"\n*   Versions:\n    *   apiVersion: \"backstage.io/v1alpha1\"\
      \n    *   apiVersion: \"backstage.io/v1beta1\"\n\nA Group describes an organizational\
      \ entity, such as a team, a business unit, or a loose collection of people.\n\
      \n### Entity Kind \"Location\"\n\n*   Singular in text: \"location\"\n*   Plural\
      \ in text: \"locations\"\n*   Versions:\n    *   apiVersion: \"backstage.io/v1alpha1\"\
      \n    *   apiVersion: \"backstage.io/v1beta1\"\n\nA Location is a marker that\
      \ references other places to look for catalog data.\n\n### Entity Kind \"Resource\"\
      \n\n*   Singular in text: \"resource\"\n*   Plural in text: \"resources\"\n\
      *   Versions:\n    *   apiVersion: \"backstage.io/v1alpha1\"\n    *   apiVersion:\
      \ \"backstage.io/v1beta1\"\n\nA Resource describes the infrastructure a system\
      \ needs to operate, like databases, topics, or buckets.\n\n### Entity Kind \"\
      System\"\n\n*   Singular in text: \"system\"\n*   Plural in text: \"systems\"\
      \n*   Versions:\n    *   apiVersion: \"backstage.io/v1alpha1\"\n    *   apiVersion:\
      \ \"backstage.io/v1beta1\"\n\nA System is a collection of resources and components\
      \ that exposes one or several APIs.\n\n### Entity Kind \"User\"\n\n*   Singular\
      \ in text: \"user\"\n*   Plural in text: \"users\"\n*   Versions:\n    *   apiVersion:\
      \ \"backstage.io/v1alpha1\"\n    *   apiVersion: \"backstage.io/v1beta1\"\n\n\
      A User describes a person, such as an employee or a contractor.\n\n## Entity\
      \ Relations\n\nThe model contains the following entity relations:\n\n### Relation\
      \ \"ownedBy\": owned by\n\n*   Reverse type: \"ownerOf\": owner of\n\nAn ownership\
      \ relation where the owner is usually an organizational entity (user or group),\
      \ and the other entity can be anything.\n\n### Relation \"ownerOf\": owner of\n\
      \n*   Reverse type: \"ownedBy\": owned by\n\nAn ownership relation where the\
      \ owner is usually an organizational entity (user or group), and the other entity\
      \ can be anything.\n\n### Relation \"providesApi\": provides API\n\n*   Reverse\
      \ type: \"apiProvidedBy\": API provided by\n\nA relation from a component to\
      \ an API it provides for consumption by others.\n\n### Relation \"apiProvidedBy\"\
      : API provided by\n\n*   Reverse type: \"providesApi\": provides API\n\nA relation\
      \ from a component to an API it provides for consumption by others.\n\n### Relation\
      \ \"consumesApi\": consumes API\n\n*   Reverse type: \"apiConsumedBy\": API\
      \ consumed by\n\nA relation from a component to an API it consumes.\n\n### Relation\
      \ \"apiConsumedBy\": API consumed by\n\n*   Reverse type: \"consumesApi\": consumes\
      \ API\n\nA relation from a component to an API it consumes.\n\n### Relation\
      \ \"dependsOn\": depends on\n\n*   Reverse type: \"dependencyOf\": dependency\
      \ of"
