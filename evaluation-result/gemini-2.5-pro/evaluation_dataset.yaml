      \ characters are allowed. If you want to use a different, more human readable\
      \ string with fewer restrictions on it in user interfaces, see the \\\"title\\\
      \" field below.\\n* \\\"namespace\\\" (default value: \\\"default\\\"): The\
      \ namespace that the entity belongs to.\\n* \\\"uid\\\": A globally unique ID\
