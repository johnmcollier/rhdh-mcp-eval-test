- conversation_group_id: catalog-model-description
  description: Ask for the catalog model / kinds description
  tag: catalog
  turns:
  - turn_id: model_description
    query: Describe the catalog model and what entity kinds are registered
    expected_tool_calls:
    - - tool_name: catalog.get-catalog-model-description
        arguments: {}
    tool_calls:
    - - tool_name: catalog.get-catalog-model-description
        arguments: {}
    response: "The catalog model in Backstage consists of several key concepts, primarily\
      \ focusing on entities and their relationships. Here's a summary of the catalog\
      \ model and the registered entity kinds:\n\n### Catalog Model Overview\n- **Entities**:\
      \ Rich objects with various kinds, each having different schemas. Entities can\
      \ have relationships with one another.\n- **Locations**: Registered as type/target\
      \ pairs, typically in the form of URLs that the catalog manages.\n\n### Entity\
      \ Metadata\nEach entity has fields such as:\n- **kind**: The type of entity\
      \ (e.g., Component, API).\n- **apiVersion**: The version of the API.\n- **metadata**:\
      \ Contains fields like name, namespace, uid, etag, title, description, annotations,\
      \ labels, tags, and links.\n\n### Registered Entity Kinds\n1. **API**\n   -\
      \ Describes an interface exposed by a component.\n   - Versions: `backstage.io/v1alpha1`,\
      \ `backstage.io/v1beta1`.\n\n2. **Component**\n   - Describes a software component,\
      \ usually with a distinct deployable artifact.\n   - Versions: `backstage.io/v1alpha1`,\
      \ `backstage.io/v1beta1`.\n\n3. **Domain**\n   - Groups a collection of systems\
      \ sharing terminology or business purpose.\n   - Versions: `backstage.io/v1alpha1`,\
      \ `backstage.io/v1beta1`.\n\n4. **Group**\n   - Describes an organizational\
      \ entity, such as a team or business unit.\n   - Versions: `backstage.io/v1alpha1`,\
      \ `backstage.io/v1beta1`.\n\n5. **Location**\n   - A marker that references\
      \ other places to look for catalog data.\n   - Versions: `backstage.io/v1alpha1`,\
      \ `backstage.io/v1beta1`.\n\n6. **Resource**\n   - Describes the infrastructure\
      \ needed for a system to operate (e.g., databases, buckets).\n   - Versions:\
      \ `backstage.io/v1alpha1`, `backstage.io/v1beta1`.\n\n7. **System**\n   - A\
      \ collection of resources and components that exposes APIs.\n   - Versions:\
      \ `backstage.io/v1alpha1`, `backstage.io/v1beta1`.\n\n8. **User**\n   - Describes\
      \ a person, such as an employee or contractor.\n   - Versions: `backstage.io/v1alpha1`,\
      \ `backstage.io/v1beta1`.\n\n### Entity Relations\nEntities can have various\
      \ relationships, such as:\n- **ownedBy**: Indicates ownership by a user or group.\n\
      - **providesApi**: Indicates that a component provides an API.\n- **consumesApi**:\
      \ Indicates that a component consumes an API.\n- **dependsOn**: Indicates dependencies\
      \ between entities.\n\nThis structure allows for a comprehensive and organized\
      \ way to manage software components, their relationships, and the infrastructure\
      \ they rely on within the Backstage ecosystem."
    expected_intent: describe the Backstage catalog model / entity kinds
