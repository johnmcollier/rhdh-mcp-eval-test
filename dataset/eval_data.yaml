- conversation_group_id: scaffolder-write-validate-dry-run
  description: Sandbox-safe dry-run validation via validate-scaffolder (execute-template
    skipped — no Templates in fixture)
  tag: scaffolder-write
  turns:
  - turn_id: validate_minimal
    query: "Validate this scaffolder template by dry-running it. Prefer scaffolder-mcp-extras.validate-scaffolder\
      \ (or scaffolder.dry-run-template). Do not execute a real scaffolder task. Pass\
      \ templateYaml as the following YAML document (name must remain mcp-eval-dry-run):\n\
      \napiVersion: scaffolder.backstage.io/v1beta3\nkind: Template\nmetadata:\n \
      \ name: mcp-eval-dry-run\n  title: MCP Eval Dry Run\nspec:\n  type: service\n\
      \  parameters: []\n  steps:\n    - id: noop\n      name: Noop\n      action:\
      \ debug:log\n      input:\n        message: mcp-eval-dry-run\n"
    expected_tool_calls:
    - - - tool_name: scaffolder-mcp-extras.validate-scaffolder
          arguments:
            templateYaml: (?s).*mcp-eval-dry-run.*
    - - - tool_name: scaffolder.dry-run-template
          arguments:
            templateYaml: (?s).*mcp-eval-dry-run.*
    tool_calls:
    - - tool_name: scaffolder.dry-run-template
        arguments:
          templateYaml: "apiVersion: scaffolder.backstage.io/v1beta3\nkind: Template\n\
            metadata:\n  name: mcp-eval-dry-run\n  title: MCP Eval Dry Run\nspec:\n\
            \  type: service\n  parameters: []\n  steps:\n    - id: noop\n      name:\
            \ Noop\n      action: debug:log\n      input:\n        message: mcp-eval-dry-run\n"
