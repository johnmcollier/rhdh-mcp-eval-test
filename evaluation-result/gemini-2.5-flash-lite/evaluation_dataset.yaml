    - - tool_name: software-catalog-mcp-extras.query-catalog-entities
        arguments:
          kind: API
    contexts:
    - "```json\n{\n  \"entities\": [\n    {\n      \"name\": \"transaction-history-api\"\
      ,\n      \"kind\": \"API\",\n      \"tags\": \"\",\n      \"description\": \"\
      API for retrieving and filtering customer transaction history and statements\"\
      ,\n      \"type\": \"openapi\",\n      \"owner\": \"accounts-team\",\n     \
      \ \"lifecycle\": \"production\",\n      \"dependsOn\": \"\"\n    },\n    {\n\
      \      \"name\": \"webhook-notifications-api\",\n      \"kind\": \"API\",\n\
      \      \"tags\": \"notifications,real-time\",\n      \"description\": \"API\
      \ to set up webhook notifications for payment and transaction events\",\n  \
      \    \"type\": \"openapi\",\n      \"owner\": \"event-team\",\n      \"lifecycle\"\
      : \"production\",\n      \"dependsOn\": \"\"\n    },\n    {\n      \"name\"\
      : \"account-access-api\",\n      \"kind\": \"API\",\n      \"tags\": \"ais,accounts,banking,fdx\"\
      ,\n      \"description\": \"FDX Compliant API to retrieve account details for\
      \ authorized third-party providers (TPPs)\",\n      \"type\": \"openapi\",\n\
      \      \"owner\": \"open-banking-team\",\n      \"lifecycle\": \"production\"\
      ,\n      \"dependsOn\": \"\"\n    },\n    {\n      \"name\": \"beneficiary-management-api\"\
      ,\n      \"kind\": \"API\",\n      \"tags\": \"payments,beneficiaries\",\n \
      \     \"description\": \"API for managing trusted payees and beneficiaries\"\
      ,\n      \"type\": \"openapi\",\n      \"owner\": \"payments-team\",\n     \
      \ \"lifecycle\": \"production\",\n      \"dependsOn\": \"\"\n    },\n    {\n\
      \      \"name\": \"payment-initiation-api\",\n      \"kind\": \"API\",\n   \
      \   \"tags\": \"pis,payments\",\n      \"description\": \"API to initiate payments\
      \ from customer accounts\",\n      \"type\": \"openapi\",\n      \"owner\":\
      \ \"payments-team\",\n      \"lifecycle\": \"production\",\n      \"dependsOn\"\
      : \"\"\n    },\n    {\n      \"name\": \"balance-check-api\",\n      \"kind\"\
      : \"API\",\n      \"tags\": \"\",\n      \"description\": \"API for real-time\
      \ account balance inquiries and balance history\",\n      \"type\": \"openapi\"\
      ,\n      \"owner\": \"accounts-team\",\n      \"lifecycle\": \"production\"\
      ,\n      \"dependsOn\": \"\"\n    },\n    {\n      \"name\": \"consent-management-api\"\
      ,\n      \"kind\": \"API\",\n      \"tags\": \"consent,authentication\",\n \
      \     \"description\": \"API to manage user consent for data access\",\n   \
      \   \"type\": \"openapi\",\n      \"owner\": \"security-team\",\n      \"lifecycle\"\
      : \"production\",\n      \"dependsOn\": \"\"\n    },\n    {\n      \"name\"\
      : \"standing-orders-api\",\n      \"kind\": \"API\",\n      \"tags\": \"\",\n\
      \      \"description\": \"API for managing recurring payments and standing orders\"\
      ,\n      \"type\": \"openapi\",\n      \"owner\": \"payments-team\",\n     \
      \ \"lifecycle\": \"production\",\n      \"dependsOn\": \"\"\n    }\n  ]\n}\n\
      ```"
    response: 'Here are all the APIs in the catalog:


      *   **transaction-history-api**: API for retrieving and filtering customer transaction
      history and statements. Owner: accounts-team. Lifecycle: production.

      *   **webhook-notifications-api**: API to set up webhook notifications for payment
      and transaction events. Owner: event-team. Lifecycle: production. Tags: notifications,
      real-time.

      *   **account-access-api**: FDX Compliant API to retrieve account details for
      authorized third-party providers (TPPs). Owner: open-banking-team. Lifecycle:
      production. Tags: ais, accounts, banking, fdx.

      *   **beneficiary-management-api**: API for managing trusted payees and beneficiaries.
      Owner: payments-team. Lifecycle: production. Tags: payments, beneficiaries.

      *   **payment-initiation-api**: API to initiate payments from customer accounts.
      Owner: payments-team. Lifecycle: production. Tags: pis, payments.

      *   **balance-check-api**: API for real-time account balance inquiries and balance
      history. Owner: accounts-team. Lifecycle: production.

      *   **consent-management-api**: API to manage user consent for data access.
      Owner: security-team. Lifecycle: production. Tags: consent, authentication.

      *   **standing-orders-api**: API for managing recurring payments and standing
      orders. Owner: payments-team. Lifecycle: production.'
